<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solicitud de Ayuda - Fundación Hope</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .container {
        background: white;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgb(0 0 0 / 0.2);
        max-width: 400px;
        width: 100%;
    }
    h1 {
        color: #34495e;
        margin-bottom: 25px;
        font-size: 24px;
        text-align: center;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #34495e;
    }
    input[type="text"],
    input[type="email"],
    textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 5px;
        border: 1.5px solid #ccc;
        font-size: 15px;
        transition: border-color 0.3s ease;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
        border-color: #2980b9;
        outline: none;
    }
    textarea {
        resize: vertical;
        min-height: 80px;
    }
    button {
        width: 100%;
        background-color: #2980b9;
        color: white;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    button:hover {
        background-color: #1f5f8b;
    }
    #mensaje {
        margin-top: 20px;
        font-weight: bold;
        color: #27ae60;
        text-align: center;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Solicitud de Ayuda - Fundación Hope</h1>
    <form id="formularioSolicitud">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo" />

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required placeholder="tucorreo@example.com" />

        <label for="motivo">Motivo de la ayuda:</label>
        <textarea id="motivo" name="motivo" required placeholder="Cuéntanos por qué necesitas ayuda"></textarea>

        <button type="submit">Enviar Solicitud</button>
    </form>
    <p id="mensaje"></p>
</div>

<script>
    document.getElementById('formularioSolicitud').addEventListener('submit', function(event){
        event.preventDefault();
        const nombre = this.nombre.value.trim();
        const correo = this.correo.value.trim();
        const motivo = this.motivo.value.trim();

        if(nombre === "" || correo === "" || motivo === "") {
            document.getElementById('mensaje').textContent = "Por favor, completa todos los campos.";
            document.getElementById('mensaje').style.color = "#e74c3c";
            return;
        }

        // Mensaje de confirmación
        document.getElementById('mensaje').textContent = "Gracias " + nombre + ", tu solicitud ha sido enviada.";
        document.getElementById('mensaje').style.color = "#27ae60";

        // Limpiar formulario
        this.reset();
    });
</script>
</body>
</html>
